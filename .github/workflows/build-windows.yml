name: Build Windows EXE

on:
  push:
    branches: [recipe-manager-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore application source
        shell: pwsh
        run: |
          $encoded = Get-Content "src/recipes_app.py.gz.b64" -Raw
          $bytes = [Convert]::FromBase64String($encoded)
          $inputStream = [System.IO.MemoryStream]::new($bytes)
          $gzip = [System.IO.Compression.GzipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
          $outputStream = [System.IO.File]::Create("src/recipes_app.py")
          $gzip.CopyTo($outputStream)
          $outputStream.Dispose()
          $gzip.Dispose()
          $inputStream.Dispose()
          python -m py_compile src/recipes_app.py

      - name: Install offline runtime libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF python-docx striprtf tkinterdnd2 pyinstaller

      - name: Build single-file Windows application
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name HamitkonimSheli
          --collect-all fitz
          --collect-all tkinterdnd2
          --hidden-import striprtf.striprtf
          --hidden-import docx
          src/recipes_app.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/HamitkonimSheli.exe")) { throw "EXE was not created" }
          Get-Item "dist/HamitkonimSheli.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload ready EXE
        uses: actions/upload-artifact@v4
        with:
          name: HamitkonimSheli-Windows-EXE
          path: dist/HamitkonimSheli.exe
          if-no-files-found: error
          retention-days: 30
